[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdk"
version = "0.1.0"
description = "python-automations の共通部品（sdk）。"
requires-python = ">=3.11"
# sdk が使うライブラリだけを書く。業務で使うライブラリは requirements.txt に書く
dependencies = [
    "python-dotenv>=1.0,<2.0",
    "selenium>=4.6,<5.0",
]

[tool.setuptools.packages.find]
include = ["sdk*"]
